<!DOCTYPE html>
<html lang="en">

<head>

<title>Recently Added Page</title>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="explore.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">


</head>

<body>

<header>

<h1>Recently Added</h1>

<nav>
<a href="driveBack.html">Home</a>
<a href="explore.html">Explore</a>
<a href="login.html">Login</a>
</nav>

</header>

<main>

<!-- FILTERS -->

<div class="filters">

<select id="budget">
<option value="all">Budget</option>
<option value="5">Under 5L</option>
<option value="10">Under 10L</option>
<option value="20">Under 20L</option>
<option value="50">Under 50L</option>
</select>

<select id="location">
<option value="all">Location</option>
<option value="Delhi">Delhi</option>
<option value="Mumbai">Mumbai</option>
<option value="Chennai">Chennai</option>
<option value="Bangalore">Bangalore</option>
</select>

<select id="brand">
<option value="all">Brand</option>
<option value="Toyota">Toyota</option>
<option value="Honda">Honda</option>
<option value="BMW">BMW</option>
<option value="Hyundai">Hyundai</option>
<option value="Maruti">Maruti</option>
</select>

<button onclick="filterCars()">Apply Filter</button>

</div>


<!-- CAR GRID -->

<div class="grid-container" id="carGrid">

<div class="grid-item" data-price="22" data-location="Mumbai" data-brand="Toyota">
<img src="Driveback_imgs/CAR1_heroAngle.jpeg">
<h5>Toyota Innova</h5>
<p>2022</p>
<p>₹22L</p>
<p>Mumbai</p>
</div>

<div class="grid-item" data-price="18" data-location="Delhi" data-brand="Honda">
<img src="Driveback_imgs/car2_heroAngle.jpeg">
<h5>Honda CR-V</h5>
<p>2021</p>
<p>₹18L</p>
<p>Delhi</p>
</div>

<div class="grid-item" data-price="55" data-location="Mumbai" data-brand="BMW">
<img src="Driveback_imgs/car3_heroAngle.jpeg">
<h5>BMW X5</h5>
<p>2020</p>
<p>₹55L</p>
<p>Mumbai</p>
</div>

<div class="grid-item" data-price="16" data-location="Bangalore" data-brand="Hyundai">
<img src="Driveback_imgs/car4_heroAngle.jpeg">
<h5>Hyundai Creta</h5>
<p>2022</p>
<p>₹16L</p>
<p>Bangalore</p>
</div>

<div class="grid-item car-hidden">
<img src="Driveback_imgs/car5_heroAngle.jpeg">
<h5>Maruti Swift</h5>
<p>2021</p>
<p>₹8L</p>
<p>Chennai</p>
</div>

<div class="grid-item car-hidden">
<img src="Driveback_imgs/car4_heroAngle.jpeg">
<h5>Hyundai Creta</h5>
<p>2022</p>
<p>₹16L</p>
<p>Bangalore</p>
</div>

<div class="grid-item car-hidden">
<img src="Driveback_imgs/car2_heroAngle.jpeg">
<h5>Honda CR-V</h5>
<p>2021</p>
<p>₹18L</p>
<p>Delhi</p>
</div>

<div class="grid-item car-hidden">
<img src="Driveback_imgs/car3_heroAngle.jpeg">
<h5>BMW X5</h5>
<p>2020</p>
<p>₹55L</p>
<p>Mumbai</p>
</div>

</div>


<div class="load-more-container">
<button id="loadMoreBtn" onclick="loadMore()">Load More</button>
</div>

</main>


<script>

/* FILTER */

function filterCars(){

let budget=document.getElementById("budget").value;
let location=document.getElementById("location").value;
let brand=document.getElementById("brand").value;

let cars=document.querySelectorAll(".grid-item");

cars.forEach(function(car){

let carPrice=parseInt(car.dataset.price);
let carLocation=car.dataset.location;
let carBrand=car.dataset.brand;

let show=true;

if(budget!=="all" && carPrice>budget){
show=false;
}

if(location!=="all" && carLocation!==location){
show=false;
}

if(brand!=="all" && carBrand!==brand){
show=false;
}

car.style.display=show?"block":"none";

});

}

/* LOAD MORE */

let currentIndex=0;

function loadMore(){

let hiddenCars=document.querySelectorAll(".car-hidden");

for(let i=currentIndex;i<currentIndex+4 && i<hiddenCars.length;i++){
hiddenCars[i].style.display="block";
}

currentIndex+=4;

if(currentIndex>=hiddenCars.length){
document.getElementById("loadMoreBtn").style.display="none";
}

}

</script>

</body>
</html>
