<!DOCTYPE html>
<html>
<head>
<title>Post your Cars</title>
<meta charset="utf-8">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{
min-height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background-image:
linear-gradient(rgba(0,0,0,0.65),rgba(0,0,0,0.75)),
url("Driveback_imgs/postcar_bg.jpg");
color:white;
background-size:cover;
background-position:center;
background-repeat:no-repeat;
}

.header{
text-align:center;
max-width:700px;
margin-top:40px;
}

.header h1{
font-size:40px;
letter-spacing:1px;
margin-bottom:10px;
}

.header p{
font-size:16px;
line-height:1.6;
opacity:0.9;
}

.post-form{
margin-top:40px;
margin-bottom:60px;

padding:35px;

min-width:500px;
max-width:700px;

border-radius:25px;

background:rgba(255,255,255,0.12);
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);

border:1px solid rgba(255,255,255,0.25);

box-shadow:0 20px 40px rgba(0,0,0,0.4);

display:flex;
flex-direction:column;
gap:12px;
}

label{
font-size:14px;
margin-top:5px;
}

input, textarea{
width:100%;
padding:10px 12px;
border-radius:6px;
border:none;

background:rgba(255,255,255,0.9);

font-size:14px;
}

textarea{
height:90px;
resize:none;
}

button{
margin-top:15px;
padding:12px;

border:none;
border-radius:6px;

background:#e50914;
color:white;

font-size:16px;
font-weight:bold;

cursor:pointer;
transition:0.25s;
}

button:hover{
background:#c40812;
transform:scale(1.03);
}
#image
{
    color:black;
}
</style>
</head>

<body>

<div class="header">
<h1> Ready to Sell Your Car?</h1>
<p>"Turn your car into opportunity. List it today and connect with genuine buyers looking for their next ride."</p>
</div>

<form id="carForm" >

<div class="post-form">

<label>Car Brand</label>
<input type="text" id="brand" required>

<label>Model</label>
<input type="text" id="model" required>

<label>Year</label>
<input type="number" id="year" required>

<label>Price</label>
<input type="number" id="price" required>

<label>Kilometers Driven</label>
<input type="number" id="km" required>

<label>Location</label>
<input type="text" id="location">

<label>Description</label>
<textarea id="description"></textarea>

<label>Upload Car Image</label>
<input type="file" id="image">

<button onclick="postCar()">Post Car</button>

</div>

</form>

<script>

function postCar(){

var brand = document.getElementById("brand");
var model = document.getElementById("model");
var year = document.getElementById("year");
var price = document.getElementById("price");
var km = document.getElementById("km");
var location = document.getElementById("location");

var valid = true;

if(brand.value == ""){
brand.style.backgroundColor = "#ffdddd";
valid = false;
}else{
brand.style.backgroundColor = "white";
}

if(model.value == ""){
model.style.backgroundColor = "#ffdddd";
valid = false;
}else{
model.style.backgroundColor = "white";
}

if(year.value == ""){
year.style.backgroundColor = "#ffdddd";
valid = false;
}else{
year.style.backgroundColor = "white";
}

if(price.value == ""){
price.style.backgroundColor = "#ffdddd";
valid = false;
}else{
price.style.backgroundColor = "white";
}

if(km.value == ""){
km.style.backgroundColor = "#ffdddd";
valid = false;
}else{
km.style.backgroundColor = "white";
}

if(valid == false){
alert("Please fill all required fields");
return;
}

var confirmPost = confirm("Do you want to post this car?");

if(confirmPost == false){
return;
}

alert("Car posted successfully!");

document.getElementById("carForm").reset();

}

</script>

</script>

</body>
</html>
